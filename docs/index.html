<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kweki — Group Question Manager</title><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="#"><b>K</b><span>Kweki<small>GROUP QUESTION MANAGER</small></span></a><button class="primary" id="add-topic">＋ Add topic</button></header>
<main><section class="hero"><div><label>CLASSROOM WORKSPACE</label><h1>Keep every question<br><i>in the conversation.</i></h1><p>Organize topics, track questions, and see who is responsible for answering.</p></div><aside><strong id="topic-count">0</strong> Topics <strong id="question-count">0</strong> Questions <strong id="asked-count">0</strong> Asked</aside></section>
<nav><button class="tab active" data-view="topics">Topic View</button><button class="tab" data-view="classmates">Classmate View</button><small>Changes are shared with everyone</small></nav><section id="content"></section></main>
<dialog id="topic-dialog"><form id="topic-form"><div class="dlghead"><h2 id="topic-heading">Add a topic</h2><button type="button" class="x" data-close="topic-dialog">×</button></div><input type="hidden" id="topic-id"><label>Topic title<input id="topic-title" required></label><div class="two"><label>Part / section<input id="topic-part" placeholder="e.g. a"></label><label>Speaker<input id="topic-speaker" placeholder="e.g. Speaker 1"></label></div><label>Assigned answerer<input id="topic-answerer" placeholder="Classmate's name"></label><footer><button type="button" class="secondary" data-close="topic-dialog">Cancel</button><button class="primary">Save topic</button></footer></form></dialog>
<dialog id="question-dialog"><form id="question-form"><div class="dlghead"><h2 id="question-heading">Add a question</h2><button type="button" class="x" data-close="question-dialog">×</button></div><input type="hidden" id="question-topic"><input type="hidden" id="question-id"><label>Question<textarea id="question-body" rows="5" required></textarea></label><p id="warning" class="warning" hidden></p><footer><button type="button" class="secondary" data-close="question-dialog">Cancel</button><button class="primary" id="save-question">Save question</button></footer></form></dialog><script src="./app.js"></script></body></html>
